name: soc-mcu
version: 0.1.0
spec: '0.1'
identity:
  slug: soc-mcu-tapeout
  display_name: Microcontroller reference SoC
  category: soc
  maturity: planned
bus: apb4
instances:
- name: gpio0
  of: gpio
  with:
    numPins: 32
    irq: true
    bidir: true
  addr: 268435456
- name: gpio1
  of: gpio
  with:
    numPins: 8
    irq: false
    bidir: false
    debounce: false
  addr: 268435712
deps:
  hwcore: ^0.1
  amba: ^0.1
